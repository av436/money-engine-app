<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Engine">
<meta name="theme-color" content="#0a0a0a">
<title>MONEY ENGINE</title>
<style>
  :root { --gold: #d4af37; --black: #0a0a0a; --card: #141414; --text: #f5f5f5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; height: 100vh; overflow: hidden; }
  .app { height: 100%; display: flex; flex-direction: column; }
  header { padding: 20px 16px 8px; text-align: center; }
  header h1 { color: var(--gold); font-size: 22px; letter-spacing: 1px; font-weight: 700; }
  header p { color: #aaa; font-size: 13px; margin-top: 2px; }
  .tabs { display: flex; border-bottom: 1px solid #222; }
  .tab { flex: 1; padding: 12px 4px; text-align: center; font-size: 13px; color: #888; cursor: pointer; }
  .tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); font-weight: 600; }
  .content { flex: 1; overflow-y: auto; padding: 12px 16px 80px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #222; }
  .card h3 { font-size: 16px; margin-bottom: 6px; }
  .score { color: var(--gold); font-weight: 700; font-size: 15px; }
  .meta { color: #aaa; font-size: 13px; margin: 4px 0; }
  button { background: transparent; border: 1px solid var(--gold); color: var(--gold); border-radius: 10px; padding: 10px 14px; width: 100%; font-size: 15px; font-weight: 600; margin-top: 10px; }
  button:active { background: var(--gold); color: var(--black); }
  .pack { background: #1a1a1a; border-radius: 12px; padding: 12px; margin-top: 10px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; border: 1px solid #333; }
  .bottom { position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f0f; border-top: 1px solid #222; padding: 8px 0 20px; display: flex; justify-content: space-around; }
  .bottom div { text-align: center; font-size: 11px; color: #888; }
  .bottom .active { color: var(--gold); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>💰 MONEY ENGINE</h1>
    <p>Black Lambo · Private</p>
  </header>
  <div class="tabs">
    <div class="tab active" data-tab="brief">Brief</div>
    <div class="tab" data-tab="port">Portfolio</div>
    <div class="tab" data-tab="pipe">Pipeline</div>
  </div>
  <div class="content" id="content"></div>
  <div class="bottom">
    <div class="active">Brief</div>
    <div>Portfolio</div>
    <div>Pipeline</div>
  </div>
</div>

<script>
const opps = [
  {id:1, title:"AI-powered local lead generation for trades", track:"portfolio", score:82, portfolio:78, summary:"Build simple sites that capture local service leads and sell them to trades. Marketing Cartel stack handles the site + AI chat.", setup:"12-20 hrs", ongoing:"2-4 hrs/wk", profit:"$8k-$25k", shared:"Marketing Cartel tech, Perth audience"},
  {id:2, title:"Niche digital product (checklists + templates)", track:"portfolio", score:71, portfolio:74, summary:"Sell downloadable packs to window tinting or trade businesses. Low ongoing once live.", setup:"8-15 hrs", ongoing:"1-2 hrs/wk", profit:"$3k-$12k", shared:"Content engine, email list"},
  {id:3, title:"Unclaimed money / grant finder service", track:"quick_cash", score:68, portfolio:55, summary:"Help businesses claim government money. Real WA grants exist.", setup:"10 hrs", ongoing:"3 hrs/wk", profit:"$2k-$8k", shared:"Research agents"}
];

function render(tab) {
  const c = document.getElementById('content');
  c.innerHTML = '';
  const list = tab === 'port' ? opps.filter(o => o.track === 'portfolio') : opps;
  list.forEach(o => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${o.title}</h3>
      <div class="score">Score ${tab==='port' ? o.portfolio : o.score}</div>
      <div class="meta">${o.summary}</div>
      <div class="meta">Setup: ${o.setup} · Ongoing: ${o.ongoing} · 12m: ${o.profit}</div>
      <div class="meta">Shared: ${o.shared}</div>
      <button onclick="launch(${o.id})">🚀 Launch → Marketing Cartel</button>
      <div id="pack${o.id}"></div>
    `;
    c.appendChild(card);
  });
}

function launch(id) {
  const o = opps.find(x => x.id === id);
  const pack = document.getElementById('pack'+id);
  pack.innerHTML = `<div class="pack"><strong>MARKETING CARTEL LAUNCH PACK</strong>

Offer: ${o.summary}
Target: Perth / WA trades
Site: Home + instant quote + AI chat · Services · Proof · About
SEO: Local keywords + GMB + content engine
Ads: Search campaigns $20-50/day test
Social: Instagram / Facebook / TikTok via Buffer, 3-5 posts/week
Checklist: Domain → site → tracking → ads → posts → reviews
KPIs: Leads/week · cost per lead · monthly profit
Shared assets: ${o.shared}

READY FOR BUILD — nothing live until you confirm.</div>`;
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tab);
  };
});
render('brief');
</script>
</body>
</html>
